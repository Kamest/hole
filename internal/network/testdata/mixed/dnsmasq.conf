# Enforcement back-end: resolves names CoreDNS already approved and records every answered
# address in the matching nftables sets.
port=5353
listen-address=127.0.0.1
bind-interfaces
no-resolv
no-hosts
no-poll
server=127.0.0.11
nftset=/api.github.com/4#inet#hole#b_3e9eb28d23
nftset=/db.example.com/4#inet#hole#b_19068b7059
nftset=/github.com/4#inet#hole#b_84f893fe86
nftset=/npmjs.org/4#inet#hole#b_3e9eb28d23
